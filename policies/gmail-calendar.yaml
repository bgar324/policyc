policies:
  - id: destructive_email_calendar_confirm
    title: Confirm destructive email or calendar actions
    description: Destructive Gmail or calendar actions require explicit confirmation before execution.
    kind: content_gated
    priority: 91
    severity: safety
    alwaysActive: false
    triggers:
      keywords: [delete, archive, trash, cancel, remove all, move meeting, clear out, get rid of, clean out, purge, nuke, wipe]
      tools: []
      artifactScope: [email, calendar_event]
      artifactOperations:
        - { artifactType: email, operation: delete }
        - { artifactType: email, operation: archive }
        - { artifactType: email, operation: update }
        - { artifactType: calendar_event, operation: delete }
        - { artifactType: calendar_event, operation: update }
        - { artifactType: calendar_event, operation: reschedule }
    requires: [destructive_action_definition, email_calendar_privacy]
    obligations:
      - type: ask_confirmation
    prohibitions:
      - type: destructive_action_without_confirmation
    runtimeInstruction: Before any destructive email or calendar action, state the exact action you would take, the exact target (which messages, thread, label, or event, and how many), the scope (one occurrence or the series; which date range), and whether it is reversible, then ask for explicit confirmation. Do not perform, and do not give step-by-step execution instructions for, the action before that confirmation.
    validators:
      - asks_confirmation_before_destructive_action
    branches:
      - id: already_authorized
        when: { authorization: present, operationNamed: true, operationNegated: false, fields: complete }
        runtimeInstruction: The user has already confirmed this exact email or calendar action, so perform only the confirmed action with the available tool now and do not ask for confirmation again. Do not perform any additional or broader mailbox or calendar change.
        obligations: []
        prohibitions: []

  - id: send_email_requires_explicit_request
    title: Sending email requires explicit request
    description: Send email only when the user explicitly asks to send, not merely to draft or prepare.
    kind: content_gated
    priority: 89
    severity: safety
    alwaysActive: false
    triggers:
      keywords: [send email, send this email, email it, forward]
      intents: [send_email]
      tools: []
      artifactScope: [email]
      artifactOperations:
        - { artifactType: email, operation: send }
        - { artifactType: email, operation: forward }
    requires: [destructive_action_definition]
    obligations:
      - type: ask_confirmation
    prohibitions:
      - type: destructive_action_without_confirmation
    runtimeInstruction: Treat sending email as externally visible and require explicit send intent plus confirmation.
    validators:
      - asks_confirmation_before_destructive_action
    branches:
      - id: already_authorized
        when: { authorization: present, operationNamed: true, operationNegated: false, fields: complete, externalDisclosure: safe }
        runtimeInstruction: Explicit send intent and confirmation are already present in the request, so send exactly the confirmed message to the confirmed recipient with the available gmail tool now and do not ask for confirmation again. Do not draft instead, change the recipient, body, or attachments, or send anything else.
        obligations:
          - type: call_tool
            value: gmail
        prohibitions: []

  - id: external_email_forward_confirmation
    title: Clarify and confirm external private-email forwarding
    description: Forwarding private email to an external recipient requires an exact recipient, bounded content scope, disclosure awareness, and confirmation.
    kind: content_gated
    priority: 92
    severity: privacy
    alwaysActive: false
    triggers:
      keywords: [forward, private thread, external advisor]
      artifactScope: [email]
      artifactOperations:
        - { artifactType: email, operation: forward }
    requires: [send_email_requires_explicit_request, email_calendar_privacy]
    obligations:
      - type: ask_confirmation
    prohibitions:
      - type: destructive_action_without_confirmation
    runtimeInstruction: Before forwarding private email, identify the exact recipient and exact thread content or attachment scope, explain the external disclosure consequence, and ask for explicit confirmation; do not call Gmail first.
    validators:
      - asks_confirmation_before_destructive_action
    branches:
      - id: confidential_external_disclosure
        when: { externalDisclosure: confidential_external }
        runtimeInstruction: This forward would disclose confidential material to an external recipient. Identify the exact recipient and exact thread content or attachment scope, explain the irreversible external disclosure consequence, then ask the user to confirm that exact disclosure. Do not call Gmail on this turn.
        obligations:
          - type: ask_confirmation
        prohibitions:
          - { type: forbidden_tool_call, value: gmail }
      - id: already_authorized
        when: { authorization: present, operationNamed: true, operationNegated: false, fields: complete, externalDisclosure: safe }
        runtimeInstruction: The user has already named the exact recipient and thread scope and confirmed the forward, so forward exactly that content to that recipient with the available gmail tool now and do not ask for confirmation again. Do not include anything outside the confirmed scope.
        obligations:
          - type: call_tool
            value: gmail
        prohibitions: []

  - id: creating_drafts_safer_than_sending
    title: Creating drafts is safer than sending
    description: Prefer creating a draft when the user asks to prepare or draft an email.
    kind: content_gated
    priority: 70
    severity: tool
    alwaysActive: false
    triggers:
      keywords: [draft email, prepare email, compose email]
      intents: [draft_email]
      tools: []
      operations: [draft]
    requires: []
    obligations:
      - type: use_output_format
        value: writing
    prohibitions: []
    runtimeInstruction: For email preparation, create or present a draft instead of sending.
    validators:
      - uses_writing_format

  - id: email_calendar_privacy
    title: Email and calendar privacy
    description: Email and calendar contents are private and should be summarized minimally.
    kind: content_gated
    priority: 87
    severity: privacy
    alwaysActive: false
    triggers:
      keywords: [email, emails, inbox, calendar, meeting]
      tools: [gmail, calendar]
      artifactTypes: [email, calendar_event]
    requires: []
    obligations: []
    prohibitions:
      - type: infer_sensitive_attributes
    runtimeInstruction: Minimize quoted private email/calendar content and avoid unnecessary disclosure.
    validators:
      - does_not_infer_sensitive_attributes

  - id: archive_delete_distinction
    title: Archive and delete distinction
    description: Archive and delete are distinct actions and must not be conflated.
    kind: content_gated
    priority: 78
    severity: safety
    alwaysActive: false
    triggers:
      keywords: [archive, delete, trash, clear out, get rid of, clean out, purge, remove]
      artifactScope: [email, calendar_event]
      artifactOperations:
        - { artifactType: email, operation: archive }
        - { artifactType: email, operation: delete }
    requires: [destructive_action_definition]
    obligations:
      - type: ask_confirmation
    prohibitions:
      - type: destructive_action_without_confirmation
    runtimeInstruction: When a request could mean either archiving or deleting, say so explicitly, explain that archiving keeps the messages recoverable and searchable while deleting removes them permanently, and ask which one is wanted and over exactly which messages before doing either. Never read an ambiguous word such as "clear out" or "get rid of" as permission to delete.
    validators:
      - asks_confirmation_before_destructive_action
    branches:
      - id: already_authorized
        when: { artifactType: email, authorization: present, operationNamed: true, operationNegated: false, fields: complete }
        runtimeInstruction: The user has confirmed the exact action by name, so perform only that confirmed action with the available gmail tool and do not ask for confirmation again. Archive means archive and delete means delete; never substitute one for the other or widen the confirmed target.
        obligations:
          - type: call_tool
            value: gmail
        prohibitions: []
      - id: already_authorized_calendar_delete
        when: { artifactType: calendar_event, authorization: present, operationNamed: true, operationNegated: false, fields: complete }
        runtimeInstruction: The request names and confirms an exact calendar deletion, so do not apply email archive semantics or ask again here; the calendar mutation policy owns that confirmed action.
        obligations: []
        prohibitions: []

  - id: calendar_event_mutation_policies
    title: Calendar event mutation policies
    description: Creating, updating, canceling, or deleting calendar events changes external state and needs confirmation.
    kind: content_gated
    priority: 88
    severity: safety
    alwaysActive: false
    triggers:
      keywords: [schedule, reschedule, cancel meeting, create event, delete event, move meeting]
      intents: [calendar_mutation]
      tools: []
      artifactTypes: [calendar_event]
      artifactScope: [calendar_event]
      artifactOperations:
        - { artifactType: calendar_event, operation: create }
        - { artifactType: calendar_event, operation: update }
        - { artifactType: calendar_event, operation: delete }
        - { artifactType: calendar_event, operation: reschedule }
    requires: [destructive_action_definition]
    obligations:
      - type: ask_confirmation
    prohibitions:
      - type: destructive_action_without_confirmation
    runtimeInstruction: Before calling the calendar, inspect or ask about availability and confirm the exact event, date, time, time zone, attendees, and invitation updates for any creation, reschedule, cancellation, or deletion.
    validators:
      - asks_confirmation_before_destructive_action
    branches:
      - id: already_authorized
        when: { authorization: present, operationNamed: true, operationNegated: false, fields: complete }
        runtimeInstruction: The exact event, date, time, time zone, and scope are already confirmed in the request, so call the available calendar tool to perform exactly that confirmed change now and do not ask for confirmation again. Do not alter any detail beyond the confirmed change.
        obligations:
          - type: call_tool
            value: calendar
        prohibitions: []

  - id: recurring_calendar_cancellation_scope
    title: Clarify recurring calendar cancellation scope
    description: Ambiguous recurring-event cancellations must identify the exact series and whether one or all future occurrences are affected.
    kind: content_gated
    priority: 90
    severity: safety
    alwaysActive: false
    triggers:
      keywords: [recurring, weekly, starting tomorrow, all future occurrences, series]
      artifactScope: [calendar_event]
      operationScope: [delete]
    requires: [calendar_event_mutation_policies, email_calendar_privacy]
    obligations:
      - type: ask_confirmation
    prohibitions:
      - type: destructive_action_without_confirmation
    runtimeInstruction: If multiple or recurring events could match, name the candidate series and ask which exact series, whether one occurrence or all future occurrences, the effective date, time, and time zone before cancellation.
    validators:
      - asks_confirmation_before_destructive_action
    branches:
      - id: already_authorized
        when: { authorization: present, operationNamed: true, operationNegated: false, fields: complete }
        runtimeInstruction: The user has already named the exact series and confirmed whether one occurrence or all future occurrences are affected, so apply the confirmed change to exactly that scope with the available calendar tool and do not ask for confirmation again. Leave every other occurrence untouched.
        obligations:
          - type: call_tool
            value: calendar
        prohibitions: []
